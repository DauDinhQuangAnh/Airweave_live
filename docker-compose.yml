name: airweave

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airweave}
      POSTGRES_USER: ${POSTGRES_USER:-airweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airweave_local_pw}
    volumes:
      - airweave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airweave} -d $${POSTGRES_DB:-airweave}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - airweave_redis:/data
    networks:
      - internal

  be:
    build:
      context: ./BE
      dockerfile: Dockerfile
    image: airweave-be:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    networks:
      internal:
      weavecarbon_default:
        aliases:
          - airweave-be

networks:
  internal:
    driver: bridge
  weavecarbon_default:
    external: true

volumes:
  airweave_pgdata:
  airweave_redis:
