name: Deploy Backend to VPS (136.110.49.135)

on:
  push:
    branches:
      - main
    paths:
      - 'BE/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-be.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy BE via SSH to obk-vm-ext-1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '136.110.49.135'
          username: 'root'
          password: 'YECoNUs2206tIVY'
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting AirWeave Backend Deployment..."

            TARGET_DIR="/root/airweave_upload"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            if [ -d "$TARGET_DIR/repo" ]; then
              cd "$TARGET_DIR/repo"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/DauDinhQuangAnh/Airweave_live.git "$TARGET_DIR/repo"
              cd "$TARGET_DIR/repo"
            fi

            rsync -avz --delete "$TARGET_DIR/repo/BE/" "$TARGET_DIR/BE/"
            cp -f "$TARGET_DIR/repo/docker-compose.yml" "$TARGET_DIR/docker-compose.yml"

            cd $TARGET_DIR
            docker compose build be
            docker compose up -d be

            echo "⚡ Running Prisma Database Migrations..."
            docker exec airweave-be-1 npx prisma migrate deploy || true

            echo "HEALTH CHECK: Verifying API Service..."
            sleep 3
            curl -f http://localhost:3000/api/nodes/admin/stats || true

            echo "SUCCESS: AirWeave Backend Deployed Successfully!"
